name = "lean-seminar"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Seminar"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

# Every file under Seminar/ is a module, so CI compiles all session material.
[[lean_lib]]
name = "Seminar"
globs = ["Seminar.+"]
